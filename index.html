<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Generator Kolorów</title>

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kolory">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f5f5f5;
}

#panel{
    padding:30px;
}

label{
    display:block;
    margin:10px;
}

button{
    padding:12px 24px;
    font-size:18px;
    cursor:pointer;
}

#screen{
    display:none;
    width:100vw;
    height:100vh;
}

#endScreen{
    display:none;
    width:100vw;
    height:100vh;
    background:black;
    color:white;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-size:42px;
}
</style>
</head>
<body>

<div id="panel">

<h1>Generator Kolorów</h1>

<label>
<input type="checkbox" value="yellow" checked>
Żółty
</label>

<label>
<input type="checkbox" value="blue" checked>
Niebieski
</label>

<label>
<input type="checkbox" value="green" checked>
Zielony
</label>

<label>
<input type="checkbox" value="orange" checked>
Pomarańczowy
</label>

<br>

<label>
Czas wyświetlania (sekundy)
<br>
<input type="number" id="czas" value="5" min="1">
</label>

<br>

<label>
Liczba wyświetleń
<br>
<input type="number" id="ilosc" value="20" min="1">
</label>

<br><br>

<button onclick="start()">START</button>

</div>

<div id="screen"></div>

<div id="endScreen">
KONIEC
<br><br>
<button onclick="location.reload()">NOWA SESJA</button>
</div>

<script>

let timer;
let pozostalo;
let ostatniKolor = null;

function losujKolor(lista){

    if(lista.length === 1){
        return lista[0];
    }

    let kolor;

    do{
        kolor = lista[Math.floor(Math.random() * lista.length)];
    } while(kolor === ostatniKolor);

    ostatniKolor = kolor;

    return kolor;
}

function start(){

    const kolory =
        [...document.querySelectorAll('input[type="checkbox"]:checked')]
        .map(el => el.value);

    if(kolory.length === 0){
        alert("Wybierz przynajmniej jeden kolor");
        return;
    }

    pozostalo = parseInt(document.getElementById("ilosc").value);

    const czas =
        parseInt(document.getElementById("czas").value) * 1000;

    document.getElementById("panel").style.display = "none";

    const screen = document.getElementById("screen");

    screen.style.display = "block";

    screen.style.backgroundColor =
        losujKolor(kolory);

    pozostalo--;

    timer = setInterval(() => {

        if(pozostalo <= 0){

            clearInterval(timer);

            screen.style.display = "none";

            document.getElementById("endScreen")
                .style.display = "flex";

            return;
        }

        screen.style.backgroundColor =
            losujKolor(kolory);

        pozostalo--;

    }, czas);

}

</script>

</body>
</html>
